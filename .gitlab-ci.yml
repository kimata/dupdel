image: gitlab.green-rabbit.net:5050/kimata/local-ubuntu:260104_3efe597c

variables:
    UV_LINK_MODE: copy
    UV_CACHE_DIR: .uv-cache
    PYRIGHT_PYTHON_FORCE_VERSION: latest
    UV_HTTP_TIMEOUT: "120"

    UV_EXTRA_INDEX_URL: "http://proxy:3141/simple/"
    UV_INSECURE_HOST: "proxy"

# NOTE: インフラ起因の一時的な失敗 (PyPI プロキシの 503 応答、runner の Pod 起動失敗、
# タイムアウト等) でパイプラインが落ちないよう、依存解決を伴うジョブは自動リトライする
# ジョブ側では extends: .retry-transient で利用する (include したファイルからも参照可)
.retry-transient:
    retry:
        max: 2
        when:
            - script_failure
            - runner_system_failure
            - stuck_or_timeout_failure

stages:
    - test
    - renovate

test-typecheck:
    stage: test
    extends: .retry-transient

    needs: []

    before_script:
        - uv sync --locked --no-editable

    script:
        - uv run python -m pyright
        - uv run mypy src/
        - uv run ty check src/

    cache:
        - key:
              files:
                  - uv.lock
          fallback_keys:
              - uv-cache-${CI_PROJECT_ID}
          paths:
              - ${UV_CACHE_DIR}
              - .mypy_cache/

test-pytest:
    stage: test
    extends: .retry-transient

    needs: []

    before_script:
        - uv sync --locked --no-editable

    script:
        - export LANG=ja_JP.UTF-8
        - export LANGUAGE=ja_JP:ja
        - export LC_ALL=ja_JP.UTF-8
        - export TERM=xterm-256color
        - uv run pytest tests/test_core.py tests/test_cache.py

    coverage: '/TOTAL.*\s+(\d+%)/'

    cache:
        - key:
              files:
                  - uv.lock
          fallback_keys:
              - uv-cache-${CI_PROJECT_ID}
          paths:
              - ${UV_CACHE_DIR}

    artifacts:
        when: always
        paths:
            - reports/**
            - htmlcov/**
        reports:
            junit: reports/junit-report.xml
            coverage_report:
                coverage_format: cobertura
                path: reports/coverage.xml

renovate:
    stage: renovate
    extends: .retry-transient

    dependencies: []

    resource_group: renovate

    image:
        name: gitlab.green-rabbit.net:5050/kimata/local-renovate:260104_3da7b77b

    variables:
        RENOVATE_CACHE_DIR: .renovate-cache
        LOG_LEVEL: info

    script:
        - renovate --platform gitlab --token ${RENOVATE_TOKEN} --endpoint ${CI_SERVER_URL}/api/v4 ${CI_PROJECT_PATH}

    cache:
        key: ${CI_JOB_NAME}-${CI_PROJECT_ID}
        paths:
            - ${RENOVATE_CACHE_DIR}

    rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          when: never
        - if: $CI_PIPELINE_SOURCE == "schedule"
        # NOTE: trigger 起動 (多プロジェクトパイプライン等) では changes が常に true と
        # 評価されるため、push 起動に限定する
        - if: $CI_PIPELINE_SOURCE == "push"
          changes:
              - renovate.json
