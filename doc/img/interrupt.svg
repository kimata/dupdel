<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#eda100"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#fcfcfb"/>

  <!-- Ctrl-C 起点 -->
  <rect x="360" y="20" width="180" height="44" rx="22" fill="#fdf5df" stroke="#eda100" stroke-width="2"/>
  <text x="450" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Ctrl-C（SIGINT）</text>
  <text x="450" y="82" text-anchor="middle" font-size="10.5" fill="#898781">端末の SIGINT はプロセスグループ全体（メイン＋ワーカー）に届く</text>

  <!-- 3分岐 -->
  <g stroke="#eda100" stroke-width="1.5" fill="none" marker-end="url(#arro)">
    <path d="M 380 64 C 250 90, 180 100, 160 126"/>
    <line x1="450" y1="64" x2="450" y2="126"/>
    <path d="M 520 64 C 650 90, 720 100, 740 126"/>
  </g>

  <!-- 左: ワーカー -->
  <rect x="30" y="130" width="260" height="90" rx="8" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="160" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">ワーカープロセス</text>
  <text x="160" y="176" text-anchor="middle" font-size="11" fill="#52514e" font-family="monospace">signal.SIG_IGN（_init_worker）</text>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#52514e">SIGINT を無視して計算を継続</text>
  <text x="160" y="212" text-anchor="middle" font-size="10.5" fill="#898781">中断の制御はメインプロセスに一任</text>

  <!-- 中央: スキャン中のメイン -->
  <rect x="320" y="130" width="260" height="90" rx="8" fill="#e2f5ee" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="450" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">メイン（並列スキャン中）</text>
  <text x="450" y="176" text-anchor="middle" font-size="11" fill="#52514e" font-family="monospace">_on_sigint → shutdown_event.set()</text>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#52514e">例外は投げない（ハンドラ差し替え）</text>
  <text x="450" y="212" text-anchor="middle" font-size="10.5" fill="#898781">Executor 内部通信の巻き戻しを避ける</text>

  <!-- 右: 入力待ちのメイン -->
  <rect x="610" y="130" width="260" height="90" rx="8" fill="#edeaf9" stroke="#4a3aa7" stroke-width="1.5"/>
  <text x="740" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">メイン（質問/削除の入力待ち）</text>
  <text x="740" y="176" text-anchor="middle" font-size="11" fill="#52514e">KeyboardInterrupt / EOFError を捕捉</text>
  <text x="740" y="196" text-anchor="middle" font-size="11" fill="#52514e" font-family="monospace">_confirm_quit() で確認</text>
  <text x="740" y="212" text-anchor="middle" font-size="10.5" fill="#898781">_ask_questions / _exec_delete 内</text>

  <!-- スキャン中の続き -->
  <rect x="320" y="260" width="260" height="96" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="450" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">as_completed ループが検知して離脱</text>
  <text x="450" y="304" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="monospace">shutdown(wait=True, cancel_futures=True)</text>
  <text x="450" y="322" text-anchor="middle" font-size="10.5" fill="#52514e">残タスクをキャンセル（shutdown は1回だけ）</text>
  <text x="450" y="342" text-anchor="middle" font-size="10.5" fill="#52514e">部分的な候補リストを持って UI に戻る</text>
  <line x1="450" y1="220" x2="450" y2="256" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- スキャン後の確認 -->
  <rect x="290" y="390" width="320" height="70" rx="8" fill="#fdf5df" stroke="#eda100" stroke-width="1.5"/>
  <text x="450" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">「スキャンを中断しました。</text>
  <text x="450" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">ここまでの結果 (N 件) で続行しますか？ [y/N]」</text>
  <text x="450" y="450" text-anchor="middle" font-size="10.5" fill="#52514e">y: event をクリアして質問フェーズへ ／ N: 終了</text>
  <line x1="450" y1="356" x2="450" y2="386" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 入力待ちの続き -->
  <rect x="640" y="260" width="200" height="96" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="740" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">「中断しますか？ [y/N]」</text>
  <text x="740" y="308" text-anchor="middle" font-size="11" fill="#52514e">y: shutdown_event を立てて終了</text>
  <text x="740" y="328" text-anchor="middle" font-size="11" fill="#52514e">N: 同じ質問・同じ確認を再表示</text>
  <text x="740" y="346" text-anchor="middle" font-size="10.5" fill="#0ca30c" font-weight="600">→ 回答途中から本当に継続できる</text>
  <line x1="740" y1="220" x2="740" y2="256" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ワーカーの補足 -->
  <rect x="60" y="260" width="200" height="60" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="160" y="284" text-anchor="middle" font-size="11.5" fill="#0b0b0b">実行中のタスクは完走し、</text>
  <text x="160" y="302" text-anchor="middle" font-size="11.5" fill="#0b0b0b">キャンセル後に整然と終了</text>
  <line x1="160" y1="220" x2="160" y2="256" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
