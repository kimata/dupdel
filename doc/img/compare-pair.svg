<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e34948"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#fcfcfb"/>

  <!-- 入力 -->
  <rect x="250" y="20" width="400" height="50" rx="8" fill="#e8f1fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="450" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">PrecomputedFileInfo × 2（同一ディレクトリのペア）</text>
  <text x="450" y="59" text-anchor="middle" font-size="11" fill="#52514e">normalized = IGNORE_PAT 除去後の名前（4文字未満なら生の名前）</text>

  <!-- ゲート共通 -->
  <g font-size="12" fill="#0b0b0b">
    <!-- 1 -->
    <rect x="290" y="100" width="320" height="46" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
    <text x="450" y="120" text-anchor="middle" font-weight="600">1. 正規化名の長さ比 ≥ 0.5 ？</text>
    <text x="450" y="137" text-anchor="middle" font-size="10.5" fill="#898781">min(len)/max(len)・高速な事前フィルタ</text>
    <!-- 2 -->
    <rect x="290" y="176" width="320" height="46" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
    <text x="450" y="196" text-anchor="middle" font-weight="600">2. quick_ratio() &gt; 0.85 ？</text>
    <text x="450" y="213" text-anchor="middle" font-size="10.5" fill="#898781">SequenceMatcher の上界値で足切り</text>
    <!-- 3 -->
    <rect x="290" y="252" width="320" height="46" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
    <text x="450" y="272" text-anchor="middle" font-weight="600">3. ratio() &gt; 0.85（MATCH_TH）？</text>
    <text x="450" y="289" text-anchor="middle" font-size="10.5" fill="#898781">正規化名どうしの正確な類似度</text>
    <!-- 4 -->
    <rect x="290" y="328" width="320" height="46" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
    <text x="450" y="348" text-anchor="middle" font-weight="600">4. 前編/後編の差分ではない？</text>
    <text x="450" y="365" text-anchor="middle" font-size="10.5" fill="#898781">_has_zengo_diff()・「午前/午後」は前後扱いしない</text>
    <!-- 5 -->
    <rect x="290" y="404" width="320" height="46" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
    <text x="450" y="424" text-anchor="middle" font-weight="600">5. 話数の差分ではない？</text>
    <text x="450" y="441" text-anchor="middle" font-size="10.5" fill="#898781">_has_episode_number_diff()・2桁以下の数字グループのみ話数と判定</text>
    <!-- 6 -->
    <rect x="290" y="480" width="320" height="46" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
    <text x="450" y="500" text-anchor="middle" font-weight="600">6. サイズ差 &lt; 40% ？</text>
    <text x="450" y="517" text-anchor="middle" font-size="10.5" fill="#898781">100 × |size1 − size2| / max(size)</text>
  </g>

  <!-- 縦の流れ -->
  <g stroke="#898781" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="450" y1="70" x2="450" y2="96"/>
    <line x1="450" y1="146" x2="450" y2="172"/>
    <line x1="450" y1="222" x2="450" y2="248"/>
    <line x1="450" y1="298" x2="450" y2="324"/>
    <line x1="450" y1="374" x2="450" y2="400"/>
    <line x1="450" y1="450" x2="450" y2="476"/>
    <line x1="450" y1="526" x2="450" y2="552"/>
  </g>

  <!-- 除外レーン -->
  <g stroke="#e34948" stroke-width="1.2" fill="none" marker-end="url(#arrr)">
    <line x1="610" y1="123" x2="700" y2="123"/>
    <line x1="610" y1="199" x2="700" y2="199"/>
    <line x1="610" y1="275" x2="700" y2="275"/>
    <line x1="610" y1="351" x2="700" y2="351"/>
    <line x1="610" y1="427" x2="700" y2="427"/>
    <line x1="610" y1="503" x2="700" y2="503"/>
  </g>
  <rect x="704" y="100" width="170" height="426" rx="8" fill="#fbe9e9" stroke="#e34948" stroke-width="1.5"/>
  <text x="789" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#e34948">除外</text>
  <text x="789" y="320" text-anchor="middle" font-size="11" fill="#52514e">（None を返す）</text>
  <g font-size="10.5" fill="#898781">
    <text x="655" y="115" text-anchor="middle">No</text>
    <text x="655" y="191" text-anchor="middle">No</text>
    <text x="655" y="267" text-anchor="middle">No</text>
    <text x="655" y="343" text-anchor="middle">前後差分</text>
    <text x="655" y="419" text-anchor="middle">話数差分</text>
    <text x="655" y="495" text-anchor="middle">No</text>
  </g>

  <!-- 出力 -->
  <rect x="230" y="556" width="440" height="50" rx="8" fill="#e2f5ee" stroke="#1baf7a" stroke-width="2"/>
  <text x="450" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">DupCand = (FileInfo 古い方, FileInfo 新しい方)</text>
  <text x="450" y="595" text-anchor="middle" font-size="11" fill="#52514e">mtime の小さい方を「古」に。新しい方が削除候補になる</text>

  <!-- 左の注記 -->
  <g font-size="10.5" fill="#898781">
    <text x="30" y="120">軽い判定を先に置き、</text>
    <text x="30" y="136">重い ratio() の計算を</text>
    <text x="30" y="152">できるだけ回避する構成</text>
    <text x="30" y="345">4・5 は正規化前の</text>
    <text x="30" y="361">生のファイル名で判定</text>
  </g>
</svg>
