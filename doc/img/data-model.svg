<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#fcfcfb"/>

  <!-- PrecomputedFileInfo -->
  <g>
    <rect x="30" y="40" width="250" height="220" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="30" y="40" width="250" height="34" rx="8" fill="#e8f1fb"/>
    <rect x="30" y="60" width="250" height="14" fill="#e8f1fb"/>
    <text x="155" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">PrecomputedFileInfo</text>
    <g font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#52514e">
      <text x="45" y="96">path: str</text>
      <text x="45" y="115">dir_path: str</text>
      <text x="45" y="134">name: str（ファイル名）</text>
      <text x="45" y="153">rel_name: str（相対パス）</text>
      <text x="45" y="172">normalized: str（正規化名）</text>
      <text x="45" y="191">size: int</text>
      <text x="45" y="210">mtime: float</text>
      <text x="45" y="229">index: int（mtime順の連番）</text>
    </g>
    <text x="155" y="252" text-anchor="middle" font-size="10" fill="#898781">core.py ／ 比較処理の入力</text>
  </g>

  <!-- FileInfo -->
  <g>
    <rect x="360" y="40" width="250" height="200" rx="8" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/>
    <rect x="360" y="40" width="250" height="34" rx="8" fill="#e2f5ee"/>
    <rect x="360" y="60" width="250" height="14" fill="#e2f5ee"/>
    <text x="485" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">FileInfo</text>
    <g font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#52514e">
      <text x="375" y="96">path: str</text>
      <text x="375" y="115">name: str（相対パス）</text>
      <text x="375" y="134">basename: str（ファイル名）</text>
      <text x="375" y="153">size: int</text>
      <text x="375" y="172">mtime: float</text>
      <text x="375" y="191">index: int</text>
      <text x="375" y="210">sm: SequenceMatcher</text>
    </g>
    <text x="485" y="232" text-anchor="middle" font-size="10" fill="#898781">constants.py ／ 表示・削除の入力</text>
  </g>

  <!-- DupCand -->
  <rect x="660" y="80" width="210" height="120" rx="8" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/>
  <rect x="660" y="80" width="210" height="34" rx="8" fill="#e2f5ee"/>
  <rect x="660" y="100" width="210" height="14" fill="#e2f5ee"/>
  <text x="765" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">DupCand</text>
  <g font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#52514e">
    <text x="675" y="136">tuple[FileInfo, FileInfo]</text>
    <text x="675" y="156">[0] … 古い方（残す側）</text>
    <text x="675" y="176">[1] … 新しい方（削除候補）</text>
  </g>

  <!-- 変換の矢印 -->
  <line x1="280" y1="140" x2="356" y2="140" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="318" y="126" text-anchor="middle" font-size="10.5" fill="#898781" font-family="monospace">compare_pair()</text>
  <text x="318" y="158" text-anchor="middle" font-size="10" fill="#898781">2件を FileInfo 2件に変換</text>
  <line x1="610" y1="140" x2="656" y2="140" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="633" y="126" text-anchor="middle" font-size="10.5" fill="#898781">×2</text>

  <!-- DirStats -->
  <g>
    <rect x="30" y="310" width="250" height="120" rx="8" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.5"/>
    <rect x="30" y="310" width="250" height="34" rx="8" fill="#edeaf9"/>
    <rect x="30" y="330" width="250" height="14" fill="#edeaf9"/>
    <text x="155" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">DirStats</text>
    <g font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#52514e">
      <text x="45" y="366">rel_path: str</text>
      <text x="45" y="385">file_count: int</text>
      <text x="45" y="404">pairs: int ／ candidates: int</text>
    </g>
    <text x="155" y="424" text-anchor="middle" font-size="10" fill="#898781">--stats モードの集計行</text>
  </g>

  <!-- SQLite -->
  <g>
    <path d="M 400 330 a 90 16 0 0 0 180 0 v 76 a 90 16 0 0 1 -180 0 z" fill="#e8f1fb" stroke="#2a78d6" stroke-width="1.5"/>
    <ellipse cx="490" cy="330" rx="90" ry="16" fill="#e8f1fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="490" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">skipped_pairs テーブル</text>
    <g font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#52514e">
      <text x="490" y="386" text-anchor="middle">path1, path2（主キー・昇順ペア）</text>
      <text x="490" y="403" text-anchor="middle">skipped_at TIMESTAMP</text>
    </g>
    <text x="490" y="440" text-anchor="middle" font-size="10" fill="#898781">カレントディレクトリの .dupdel_cache.db（SQLite）</text>
  </g>

  <!-- cache キー説明 -->
  <g font-size="10.5" fill="#52514e">
    <rect x="640" y="320" width="230" height="100" rx="8" fill="none" stroke="#c3c2b7" stroke-dasharray="4 3"/>
    <text x="655" y="344" font-weight="600" fill="#0b0b0b">ペアキーの生成（get_pair_key）</text>
    <text x="655" y="366">1. 各パスを絶対パスに解決</text>
    <text x="655" y="384">2. 2つを辞書順に並べてタプル化</text>
    <text x="655" y="402" fill="#898781">→ 引数の順序に依存しない一意キー</text>
  </g>
  <line x1="636" y1="370" x2="596" y2="370" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
